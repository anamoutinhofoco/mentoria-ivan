<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Business · Cronograma de Implantação</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EAEAEA;--white:#fff;--navy:#002055;--navy2:#003580;
  --blue:#1565C0;--blue2:#1976D2;--blue3:#2196F3;--blue4:#0057D9;
  --bb:#EBF2FF;--bt:#1565C0;--div:rgba(0,53,128,0.12);
  --sh:0 2px 12px rgba(0,53,128,0.06);--shm:0 6px 28px rgba(0,53,128,0.11);
  --or:#E65100;--orb:#FFF3E0;--gr:#1B5E20;--grb:#E8F5E9;
  --pu:#4A148C;--pub:#F3E5F5;
}
body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:var(--navy);font-size:15px;line-height:1.6}

.pageheader{background:var(--navy2);position:relative;overflow:hidden}
.pageheader::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:linear-gradient(135deg,var(--blue2),var(--blue4));opacity:.4}
.pageheader::after{content:'';position:absolute;bottom:-50px;right:200px;width:160px;height:160px;border-radius:50%;border:2px solid rgba(33,150,243,.2);background:transparent}
.pageheader-inner{max-width:1200px;margin:0 auto;padding:32px 52px;display:flex;align-items:center;gap:40px;position:relative;z-index:1}
.pageheader-left{flex:1}
.pageheader-eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:8px}
.pageheader-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(20px,2.4vw,30px);color:#fff;line-height:1.15;margin-bottom:10px}
.pageheader-title span{color:var(--blue3)}
.pageheader-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.55);flex-wrap:wrap}
.phsep{color:rgba(255,255,255,.25)}
.pageheader-right{display:flex;gap:10px;flex-shrink:0}
.pageheader-pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:10px 14px;min-width:160px}
.php-label{display:block;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue3);margin-bottom:3px}
.php-name{font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;color:#fff;line-height:1.3}

.tabwrap{position:sticky;top:0;z-index:200;background:var(--white);box-shadow:0 2px 16px rgba(0,53,128,0.10)}
.tabs{display:flex;max-width:1200px;margin:0 auto}
.tab{flex:1;padding:16px 8px 14px;font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:rgba(0,32,85,.4);border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .18s}
.tab .ti{font-size:17px}
.tab:hover{color:var(--blue);background:var(--bb)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);background:var(--bb)}
.tab:not(:last-child){border-right:1px solid var(--div)}

.panel{display:none;padding:52px 0}
.panel.on{display:block}
.w{max-width:1200px;margin:0 auto;padding:0 52px}

.sh{display:grid;grid-template-columns:63% 37%;border-radius:16px;overflow:hidden;box-shadow:var(--shm);margin-bottom:36px}
.shl{background:var(--white);padding:30px 44px}
.shr{background:var(--navy2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.shr::before{content:'';position:absolute;top:-36px;right:-36px;width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--blue2),var(--blue4));opacity:.38}
.sn{font-family:'Nunito',sans-serif;font-weight:900;font-size:60px;color:rgba(255,255,255,.15);line-height:1;position:relative;z-index:1}
.badge{display:inline-block;background:var(--bb);color:var(--bt);font-weight:800;font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:4px 10px;border-radius:6px;margin-bottom:8px}
.stitle{font-family:'Nunito',sans-serif;font-weight:900;font-size:23px;color:var(--navy);line-height:1.2;margin-bottom:5px}
.sdesc{font-size:13px;color:rgba(0,32,85,.58)}

.tleg{background:var(--white);border-radius:12px;padding:14px 22px;margin-bottom:20px;display:flex;gap:18px;flex-wrap:wrap;box-shadow:var(--sh);border:1px solid var(--div)}
.li{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:rgba(0,32,85,.68)}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.trow{background:var(--white);border-radius:12px;box-shadow:var(--sh);border:1px solid var(--div);overflow:hidden;display:grid;grid-template-columns:50px 1fr;margin-bottom:10px}
.tord{display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:900;font-size:19px;background:var(--navy2);color:rgba(255,255,255,.2);position:relative;overflow:hidden}
.tord::after{content:'';position:absolute;top:-12px;right:-12px;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue2),var(--blue4));opacity:.22}
.tord span{position:relative;z-index:1}
.tc{padding:14px 20px;display:grid;grid-template-columns:1fr 145px 200px 145px;gap:10px;align-items:start}
.tn{font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:var(--navy);margin-bottom:3px;line-height:1.3}
.td{font-size:12px;color:rgba(0,32,85,.58);line-height:1.4}
.tp{display:inline-flex;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:4px;margin-top:4px}
.p1{background:#FFEBEE;color:#C62828}.p2{background:var(--orb);color:var(--or)}
.p3{background:var(--bb);color:var(--blue)}.p4{background:var(--grb);color:var(--gr)}
.p5{background:var(--pub);color:var(--pu)}.p6{background:#FFF9C4;color:#F57F17}.p7{background:#E8EAF6;color:#1A237E}
.tcl{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,32,85,.35);margin-bottom:3px}
.tcv{font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.35}
.tcv.b{color:var(--blue)}

.cal{display:grid;grid-template-columns:1fr 1fr;border-radius:14px;overflow:hidden;box-shadow:var(--shm);margin-bottom:28px;border:1px solid var(--div)}
.cw{display:flex;flex-direction:column}
.cwh{padding:14px 18px;position:relative;overflow:hidden}
.cwh.w1{background:var(--navy2)}.cwh.w2{background:#1B3A6B}
.cwh::after{content:'';position:absolute;top:-16px;right:-16px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--blue2),var(--blue4));opacity:.3}
.cwn{font-family:'Nunito',sans-serif;font-weight:900;font-size:24px;color:rgba(255,255,255,.17);line-height:1}
.cwt{font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;color:#fff;position:relative;z-index:1}
.cws{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.5);margin-top:2px;position:relative;z-index:1}
.cdays{background:var(--white);display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--div);flex:1}
.cday{padding:9px 10px;border-right:1px solid var(--div)}
.cday:last-child{border-right:none}
.cday.ld{background:#F0F4FF}.cday.pd{background:#FFF8F5}
.cdl{font-size:8px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:rgba(0,32,85,.38);margin-bottom:1px}
.cdn{font-family:'Nunito',sans-serif;font-weight:900;font-size:18px;color:var(--navy);line-height:1;margin-bottom:2px}
.cdt{font-size:7.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 5px;border-radius:3px;display:inline-block}
.tpre{background:#E3F2FD;color:#0D47A1}.tlaunch{background:var(--grb);color:var(--gr)}
.tlive{background:#E8EAF6;color:#1A237E}.tpost{background:var(--orb);color:var(--or)}
.cdtxt{font-size:9px;color:rgba(0,32,85,.62);line-height:1.3;margin-top:2px;font-weight:600}

.llist{display:flex;flex-direction:column;gap:9px;margin-top:4px;margin-bottom:36px}
.litem{display:grid;grid-template-columns:130px 1fr;border-radius:9px;overflow:hidden;border:1px solid var(--div)}
.ll{background:var(--navy2);padding:14px 16px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.ll::after{content:'';position:absolute;top:-12px;right:-12px;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--blue2),var(--blue4));opacity:.22}
.ln{font-family:'Nunito',sans-serif;font-weight:900;font-size:20px;color:rgba(255,255,255,.17);line-height:1;margin-bottom:1px}
.lt{font-size:9.5px;font-weight:700;color:var(--blue3);letter-spacing:.06em}
.lr{background:var(--white);padding:14px 18px}
.ltitle{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:var(--navy);margin-bottom:3px}
